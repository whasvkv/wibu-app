name: Run Scraper Automatically

on:
  schedule:
    # Berjalan otomatis setiap hari jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Mengizinkan tombol tombol "Run workflow" manual di GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Script
      env:
        # Masukkan API Key / Token di Settings -> Secrets jika dibutuhkan
        API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
      run: python main.py
